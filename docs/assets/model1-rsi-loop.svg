<title id="title">Gen3 to Gen4: the self-improvement loop, by what each part does</title><desc id="description">Design figure with what each step has measured, November 17, 2026. A machine that turns failure into verified capability, and verified capability into a stronger model. The loop: Model 1 gets stuck; the system works out what was missing; searches for it; a verifier proves the answer; the bank stores the step; the step is replayed with almost no new model work; Model 1 trains on it; next time Model 1 crosses that point on its own. When Model 1 is stuck there are two doors. Door 1, search: search (discovery): the tokenizer makes a small search, the engine tries candidates, the verifier checks a hit. Door 2, absorb: absorb (training): the model saw what it needed and still decided wrong; train the decision itself (run D1). Both lead to an independent verifier, then the Atlas bank, then replay at about zero model inference (procedural learning) and training into Model 1 (neural learning). Where each step stands: Model 1 works the pin: measured, R1: 172 of 178 findings, 3 false alarms; harder mission T2: 18 of 46, below a coin-guessing operator; Stuck points (halts): measured, 164 halts in 240 pins: 102 with the evidence on screen, 62 missing it; Search door: tokenizer + engine: measured, lockpick 15 of 50 against a random hint&#x27;s 11 to 19: not shown better; Absorb door: train the decision: preregistered, D1 sealed, go given, not yet run; cap $24; Verifier: measured, holds on its checks; replays byte for byte; tight rule after an attack; blind to indirect calls; Atlas bank: built, bank and promotion gate built; nothing from the loop promoted yet; Replay at ~0 inference: partly measured, hand-written steps only; templates from the walker&#x27;s traces 0 %; Fewer rescues next generation: not measured, needs two trained generations. What would count as self-improvement, not measured yet: rescues needed: fewer each generation; replayable steps in the bank: more each generation; the model alone, without rescue: stronger each generation; verified frontier: keeps moving forward. Design and hypothesis. No self-improvement has been shown: no generation has been trained on its own rescues yet. No frontier-level capability is claimed. Synthetic code only; no real-code result. No quantum-computer time; no quantum advantage.</desc>
