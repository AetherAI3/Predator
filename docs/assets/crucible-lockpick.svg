<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title description">
<title id="title">Crucible explained as a lockpick: hold tension, test pins, keep what sets</title>
<desc id="description">Illustrative admitted Crucible validation cycle. A master checkpoint holds verified evidence. Fanout proposes candidate chains and a modeled score ranks tests. Only a native software receipt can support a HIT; untested proposals remain open. If configured, JEV provides advisory triage. Supported evidence and open obligations become the next checkpoint, with a separate repair hypothesis and check. This figure is not a record of four executed workers or measured quantum advantage.</desc>
