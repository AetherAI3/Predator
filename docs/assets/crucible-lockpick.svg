<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5fd1ff" text-anchor="start" letter-spacing="1">THE ANALOGY</text>
<rect x="72" y="252" width="4" height="78" rx="2" fill="#5fd1ff"/>
<text x="90" y="268" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Tension wrench</text>
<text x="90" y="290" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5fd1ff" text-anchor="start" >Master checkpoint C</text>
<text x="90" y="310" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Holds everything already verified so it</text>
<text x="90" y="327" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >cannot slip while the next pin is tested.</text>
<rect x="72" y="344" width="4" height="78" rx="2" fill="#a78bfa"/>
<text x="90" y="360" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Pins</text>
<text x="90" y="382" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" >Candidate chains</text>
<text x="90" y="402" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Fanout proposes alternatives from one</text>
<text x="90" y="419" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >checkpoint; tests need separate admission.</text>
<rect x="72" y="436" width="4" height="78" rx="2" fill="#f5c26b"/>
<text x="90" y="452" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >The click</text>
<text x="90" y="474" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f5c26b" text-anchor="start" >Native check</text>
<text x="90" y="494" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >The software itself says whether a pin set.</text>
<text x="90" y="511" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >No receipt, no click; the pin did not set.</text>
<rect x="72" y="528" width="4" height="78" rx="2" fill="#67dcb4"/>
<text x="90" y="544" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >A set pin</text>
<text x="90" y="566" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#67dcb4" text-anchor="start" >HIT</text>
<text x="90" y="586" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Banked with its evidence. A pin that drops</text>
<text x="90" y="603" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >may be a miss; untested pins stay open.</text>
<rect x="72" y="620" width="4" height="78" rx="2" fill="#a78bfa"/>
<text x="90" y="636" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Choosing the next pin</text>
<text x="90" y="658" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" >Modeled rank + evidence gate</text>
<text x="90" y="678" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Energy ranks a test; the software result</text>
<text x="90" y="695" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >determines what can advance.</text>
<rect x="72" y="712" width="4" height="78" rx="2" fill="#67dcb4"/>
<text x="90" y="728" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Working the set pin</text>
<text x="90" y="750" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#67dcb4" text-anchor="start" >Repair lane</text>
<text x="90" y="770" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Pair a HIT with a repair hypothesis;</text>
<text x="90" y="787" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >validate the fix in a separate check.</text>
