<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title description">
<title id="title">Crucible explained as a lockpick: hold tension, test pins, keep what sets</title>
<desc id="description">One Crucible depth step. A master checkpoint holds the verified state like a tension wrench. It fans out into several small chains, each a candidate pin: an AI proposal, a native check on the software, and a quantum-method selection. Chains end in HIT or REJECT. JEV triage and the master Q selection choose the chain that advances. The winner's evidence and open obligations become the next checkpoint; a repair lane runs behind each HIT. Failed chains stay in the record. This figure shows control structure, not a measured result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#adbbce"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67dcb4"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker></defs>
<rect x="1" y="1" width="1278" height="1118" rx="18" fill="#070d17" stroke="#2a3b51" stroke-width="1.5"/>
<text x="48" y="52" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#67dcb4" text-anchor="start" letter-spacing="1">CRUCIBLE, EXPLAINED AS A LOCKPICK</text>
<text x="48" y="108" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#f2f6ff" text-anchor="start" >Hold tension, test pins, keep what sets</text>
<text x="48" y="145" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#adbbce" text-anchor="start" >One depth step of the C → Q → C loop. Every pin is tested by a native check; the loop, not a person, picks the pin that advances.</text>
<rect x="48" y="190" width="352" height="640" rx="14" fill="#0f1928" stroke="#2a3b51" stroke-width="1.5"/>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5fd1ff" text-anchor="start" letter-spacing="1">THE ANALOGY</text>
<rect x="72" y="252" width="4" height="78" rx="2" fill="#5fd1ff"/>
<text x="90" y="268" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Tension wrench</text>
<text x="90" y="290" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#5fd1ff" text-anchor="start" >Master checkpoint C</text>
<text x="90" y="310" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Holds everything already verified so it</text>
<text x="90" y="327" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >cannot slip while the next pin is tested.</text>
<rect x="72" y="344" width="4" height="78" rx="2" fill="#a78bfa"/>
<text x="90" y="360" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Pins</text>
<text x="90" y="382" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" >CFC chains</text>
<text x="90" y="402" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Many small, cheap candidates fanned out from</text>
<text x="90" y="419" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >one checkpoint, each a c / check / q stack.</text>
<rect x="72" y="436" width="4" height="78" rx="2" fill="#f5c26b"/>
<text x="90" y="452" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >The click</text>
<text x="90" y="474" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f5c26b" text-anchor="start" >Native check</text>
<text x="90" y="494" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >The software itself says whether a pin set.</text>
<text x="90" y="511" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >No receipt, no click; the pin did not set.</text>
<rect x="72" y="528" width="4" height="78" rx="2" fill="#67dcb4"/>
<text x="90" y="544" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >A set pin</text>
<text x="90" y="566" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#67dcb4" text-anchor="start" >HIT</text>
<text x="90" y="586" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Banked with its evidence. A pin that drops</text>
<text x="90" y="603" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >is a REJECT and stays in the record.</text>
<rect x="72" y="620" width="4" height="78" rx="2" fill="#a78bfa"/>
<text x="90" y="636" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Choosing the next pin</text>
<text x="90" y="658" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start" >JEV triage + master Q</text>
<text x="90" y="678" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Which pin is binding now is chosen from</text>
<text x="90" y="695" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >verified chain energies and outcomes.</text>
<rect x="72" y="712" width="4" height="78" rx="2" fill="#67dcb4"/>
<text x="90" y="728" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="start" >Working the set pin</text>
<text x="90" y="750" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#67dcb4" text-anchor="start" >Repair lane</text>
<text x="90" y="770" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >Behind every HIT a fix is proposed and</text>
<text x="90" y="787" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="start" >checked the same way as the loop deepens.</text>
