<text x="48" y="108" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#f2f6ff" text-anchor="start" >Hold tension, test pins, keep what sets</text>
<text x="48" y="145" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#adbbce" text-anchor="start" >Illustrative admitted cycle: model scores rank tests; only native receipts can support a HIT.</text>
