<text x="836" y="219" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#f2f6ff" text-anchor="middle" >Master checkpoint  C</text>
<text x="836" y="241" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#adbbce" text-anchor="middle" >signed evidence · verified passes · open obligations</text>
