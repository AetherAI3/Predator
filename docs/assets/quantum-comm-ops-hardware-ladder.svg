<text x="48" y="278" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f6ff" >J6 · Oct 31</text>
<text x="48" y="300" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >ibm_kingston · 2 jobs · 3 shots · 395/400 first pass · gate not met</text>
