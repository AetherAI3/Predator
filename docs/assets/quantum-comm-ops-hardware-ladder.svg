<text x="440" y="660" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#f2f6ff" >as three jobs</text>
<text x="70" y="700" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >Both orders (J11); fresh circuits (J0). Three circuits only.</text>
<rect x="632" y="590" width="600" height="130" rx="12" fill="#101b2b" stroke="#293e57"/>
<text x="654" y="622" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#67dcb4" >Five one-job missions, five shots</text>
<text x="654" y="660" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#f2f6ff" >2,000 / 2,000</text>
<text x="910" y="660" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#f2f6ff" >recipients verified first pass</text>
<text x="654" y="692" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >0 majority bit errors in 480,000 raw bit-shots</text>
<text x="654" y="712" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >raw error 0.41–0.52% per bit before the five-shot majority</text>
<text x="48" y="745" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >Saving = IBM accounting for batched circuits · known classical frames · scripted recipients · no quantum advantage established</text>
