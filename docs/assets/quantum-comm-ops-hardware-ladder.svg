<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
<title id="title">Quantum Comm Ops on IBM hardware: the same mission, from 81 jobs to one</title><desc id="description">Billed IBM QPU seconds for the same 400-recipient delivery mission. J5 · Oct 31 on ibm_fez: 162 seconds in 81 jobs · 3 shots, 399/400 first pass. J6 · Oct 31 on ibm_kingston: 6 seconds, 395/400 first pass · gate not met. J7 · Oct 31 on ibm_kingston: 5 seconds in one job, 400/400 first pass; repeated at 5 seconds on two more datasets, with a secret key, and on ibm_fez on November 1, each 400 of 400. Across the five one-job missions: 2000 of 2000 first pass, 0 majority bit errors in 480,000 raw bit-shots. Inset: three circuits compiled once bill 2 seconds as one job and 6 seconds as three jobs on ibm_fez. The saving is provider accounting for batched circuits; no quantum advantage is established.</desc>
<rect x="1" y="1" width="1278" height="758" rx="18" fill="#070d17" stroke="#2a3b51"/>
<text x="48" y="48" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#67dcb4" >IBM HARDWARE / 400-RECIPIENT DELIVERY MISSION</text>
<text x="1232" y="48" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#adbbce" text-anchor="end">31 OCT – 1 NOV 2026</text>
<text x="48" y="112" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#f2f6ff" >Same mission. 162 s → 5 s of billed QPU.</text>
<text x="48" y="152" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#adbbce" >1,200 circuits per mission · billed seconds as reported by the provider · different devices, shot counts and days · linear scale</text>
<text x="48" y="216" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f6ff" >J5 · Oct 31</text>
<text x="48" y="238" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >ibm_fez · 81 jobs · 3 shots · 399/400 first pass</text>
