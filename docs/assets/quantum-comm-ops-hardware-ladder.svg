<text x="48" y="402" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2f6ff" >J8 · Oct 31</text>
<text x="48" y="424" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#adbbce" >ibm_kingston · 1 job each · 2 more datasets · 400/400 and 400/400</text>
<rect x="560" y="384" width="17.284" height="30" rx="5" fill="#67dcb4"/>
