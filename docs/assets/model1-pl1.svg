<title id="title">First test of the self-improvement loop (PL1): where Model 1 got stuck, did a hint help?</title><desc id="description">First test of the self-improvement loop, PL1, November 16, 2026, measured on fixtures with no quantum-computer time. 100 of Model 1&#x27;s own stuck points, each read once from a hint and counted only when the verifier&#x27;s tight rule confirms. Evidence missing, 50 stuck points, verified: placebo 9, Nano lockpick 15, random hint 17, 19, 15, 11, 15 across five seeds, teacher&#x27;s hint 18. The noise floor is 8: two random seeds differ by up to 8. Teacher&#x27;s hint against placebo, net 9, is above the floor: IMPROVED. Lockpick against placebo, net 6, is not: no difference; lockpick against the random hint: no difference at any seed. Evidence on screen, 50 stuck points, verified: placebo 0, lockpick 0, random 1, teacher 1; false alarms 41, 38, 39, 41. No hint helped there. Verdict: ONLY THE TEACHER&#x27;S SEAT ADVANCES MODEL 1, NOT ABOVE GUESSING ON BOTH KINDS OF PIN. Next: train the decision, run D1, sealed and not yet run. No quantum advantage claimed.</desc>
