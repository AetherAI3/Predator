<svg xmlns="http://www.w3.org/2000/svg" width="960" height="642" viewBox="0 0 960 642" role="img" aria-labelledby="title description">
<title id="title">Replay at about zero model inference: solve it once, run it again without the model</title><desc id="description">Design figure with first measurements, November 17, 2026. Solve it once, run it again without the model. First time: Model 1 reasons; search and tools find the way; the verifier proves it; AQRC compiles a replayable step; Atlas stores it. Next time: a new pin arrives; it matches a stored step; it replays the step; the result comes back. Retrieval hands the model notes to read and reason about again. Replay runs the proven step itself. Why it matters for a small model: the bank of runnable steps could grow far larger than the model; the model would only decide when a stored step applies, or when to make a new one (hypothesis). Measured on fixtures: a hand-written replay skill answered 8,400 of 8,400 pins on its home ground with no model, but asserted false things on 5 of 11 unfamiliar code shapes; a check on what the tools showed stops that, except for hidden calls; templates compiled from 400 verified traces of the hand-written walker (stand-ins for model traces; no model ran) answered 0 % of unseen pins; replaying a proven path paid only when it handed over the decision itself: 27 of 32 findings against 13 to 14. Status: nothing yet compiles the model&#x27;s own behavior into a replayable step. Synthetic code; no quantum-computer time.</desc>
