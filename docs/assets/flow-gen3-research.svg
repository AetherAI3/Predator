<svg xmlns="http://www.w3.org/2000/svg" width="840" height="226" viewBox="0 0 840 226" role="img" aria-labelledby="title desc">
<title id="title">Gen3 · AI–quantum research loop</title><desc id="desc">Research goal, not a completed run: AI and Q1 propose solutions, software tests check them, and verified results guide AI, Q2 and later steps. Quantum advantage is not established.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161924"/><stop offset="1" stop-color="#0c1019"/></linearGradient></defs>
<rect x=".5" y=".5" width="839" height="225" rx="16" fill="url(#bg)" stroke="#30394a"/>
<rect x="22" y="23" width="4" height="17" rx="2" fill="#d3b5ff"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="36" y="37" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d3b5ff">RESEARCH GOAL · NOT A COMPLETED RUN</text>
<rect x="22" y="58" width="254" height="110" rx="11" fill="#251f35" stroke="#d3b5ff" stroke-opacity=".27"/>
<text x="38" y="90" font-size="22" font-weight="700" fill="#f2f5fa">AI → Q1 → test</text>
<text x="38" y="120" font-size="16" fill="#c7d1e1">Search for possible fixes</text>
<text x="38" y="145" font-size="16" fill="#c7d1e1">Check them on real code</text>
<path d="M280 112h10m-4-4 4 4-4 4" fill="none" stroke="#d3b5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="293" y="58" width="254" height="110" rx="11" fill="#251f35" stroke="#d3b5ff" stroke-opacity=".27"/>
<text x="309" y="90" font-size="22" font-weight="700" fill="#f2f5fa">AI → Q2 → test</text>
<text x="309" y="120" font-size="16" fill="#c7d1e1">Use the previous evidence</text>
<text x="309" y="145" font-size="16" fill="#c7d1e1">Update the search</text>
<path d="M551 112h10m-4-4 4 4-4 4" fill="none" stroke="#d3b5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="564" y="58" width="254" height="110" rx="11" fill="#251f35" stroke="#d3b5ff" stroke-opacity=".27"/>
<text x="580" y="90" font-size="22" font-weight="700" fill="#f2f5fa">AI → Q3 → …</text>
<text x="580" y="120" font-size="16" fill="#c7d1e1">Repeat while useful</text>
<text x="580" y="145" font-size="16" fill="#c7d1e1">Measure gains and limits</text>
<text x="22" y="201" font-size="15" fill="#aebbd0">Each step builds on verified results. Quantum advantage is not established.</text>
</g></svg>
