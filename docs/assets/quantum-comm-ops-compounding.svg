<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img" aria-labelledby="title description">
<title id="title">Compounding on fixture tasks: 40 agents, one shared evidence bank, three cycles</title><desc id="description">Measured compounding rehearsal on fixture tasks with known answers: forty agents, one shared evidence bank, three cycles, run 3b with a paid first-tier worker paced at 40 seconds, escalating to a mid-cost worker; a frontier captain was available and not called. Agents verified on the first try per cycle: 24, then 38, then 39 of forty. Escalations per cycle: 16, then 2, then 1. Cost per verified record in UVT per cycle: 1,609, then 722, then 716; cycle three cost 0.445 times cycle one. Gates K-4a MET, K-4b MET; 0 errors; run 3b model spend 4.06 dollars. Earlier free-tier runs one and two (a free first-tier worker) reached 23 then 39 of forty in cycles one and two, with cycle-two cost per verified record 0.07-0.13 (7.6-14x cheaper) of cycle one; their cycle three was stopped by the model gateway&#x27;s hourly call quota (HTTP 429), refusals charged at reservation. A scripted warm-up cycle on other chains seeded the bank. No quantum-computer time was used; these are measured model calls, not a projection; no quantum advantage is claimed.</desc>
