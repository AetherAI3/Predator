<text x="930" y="244" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#adbbce" >1,024 shots each</text>
<text x="930" y="279" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#adbbce" >3 s billed QPU time</text>
