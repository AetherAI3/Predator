<title id="title">IBM Fez: published compiler measurements</title><desc id="description">Author-reported pilot, September 6, 2026. Ordinary compilation in blue, joint5 in purple. Native two-qubit gates decreased 144 to 103 per circuit. Total-variation distance decreased in both related cases. Expected energy increased, which is worse for the minimization objective. One fixture, four circuits, one job; no independent confirmation or quantum advantage established.</desc>
