<title id="title">Model 1&#x27;s replay path: replay a proven path, then Model 1 takes over</title><desc id="description">Model 1&#x27;s replay path, measured on fixtures with no quantum-computer time, November 15, 2026 (the depth ladder, T3 stage A). A replayed step is a recorded tool call of the proven path, run again into the pin before the model&#x27;s first turn; the model writes no reply for it. The same trained 9B started at five points of the scripted teacher&#x27;s proven path on 60 synthetic pins with 32 planted findings. from scratch: 0 calls replayed, 490 model replies, 13 of 32 findings verified, 22 false alarms of 28; a quarter of the way: 66 calls replayed, 420 model replies, 13 of 32 findings verified, 21 false alarms of 28; halfway: 157 calls replayed, 347 model replies, 13 of 32 findings verified, 20 false alarms of 28; three quarters: 239 calls replayed, 271 model replies, 14 of 32 findings verified, 20 false alarms of 28; the end of the path: 344 calls replayed, 134 model replies, 27 of 32 findings verified, 20 false alarms of 28. On the 12 findings verified from every start, model replies fell from 80 to 12. One pin, fn_23965, synthetic: from scratch: 0 replayed, 7 model calls, claims protected, not confirmed; a quarter of the way: 1 replayed, 6 model calls, claims protected, not confirmed; halfway: 2 replayed, 5 model calls, claims protected, not confirmed; three quarters: 3 replayed, 4 model calls, claims protected, not confirmed; the end of the path: 4 replayed, 0 model calls, claims finding, confirmed. Replay works as plumbing: steps taken from the record need no model reply and play back exactly. It does not make the model decide better: partial replays left the count at 13 to 14 of 32, only the full path, which holds the deciding call, reached 27, and false alarms stayed at 20 to 22 of 28 at every start. Replay of the teacher&#x27;s proven path into the same pin, and exact playback of Model 1&#x27;s own recorded runs, are measured. Using Model 1&#x27;s own runs as stored steps on other pins, and AQRC compiling a step of Model 1&#x27;s, are not. One model, one seed, dev pins, synthetic code. No quantum-computer time.</desc>
