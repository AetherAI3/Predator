<title id="title">Quantum Comm Ops agent loop: one cycle from the shared evidence bank to the reliability-weighted vote</title><desc id="description">Schematic of one cycle of the agent loop. A shared evidence bank holds verified records with receipts. The encoder picks the top eight records per agent: recall at eight was 86.8% for the code-4 encoder against 38.3% for BM25 on the pool of 110 fixture chains, measured on fixture tasks. The briefing compiler keeps only records from the same chain and drops contradicted ones, lifting scripted-agent verification from 5/110 to 99/110 chains, measured on fixtures. Delivery to 400 agents ran as 1 IBM job on ibm_fez billed 5.0 seconds, 400 of 400 verified on the first try, measured on IBM hardware on 1 Nov 2026. Agents report HIT, MISS or REJECT and verified records are banked with a receipt: in the compounding rehearsal 24, then 38, then 39 of forty agents verified first try across three cycles, measured on fixtures. Disagreements go to a reliability-weighted vote, which matched the answer on 12/12 tasks where a plain majority managed 9/12, measured offline on fixtures. A greyed side box shows the deep cell: the think-longer worker verified 0 of 12 tasks at depths 4, 8, 16 and stays advisory; narrow-then-deepen was not run under a five-dollar lane cap. A return arrow labelled next cycle leads back to the bank. Numbers come from preregistered runs on fixture tasks with known answers except the delivery stage, which ran on IBM hardware; no quantum advantage is claimed.</desc>
