<text x="86" y="576" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#f2f6ff" >Lesson: organise search by mechanism, not by position. Recorded outcomes point this way; the scripted tests measure its value.</text>
<circle cx="72" cy="597" r="4" fill="#32c7eb"/>
<text x="86" y="601" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#f2f6ff" >Now the Gen2 swarm&#x27;s default, on a draft (not main): every technique once (P15), then explore 90 % (P16); settings revert.</text>
<circle cx="72" cy="622" r="4" fill="#efc479"/>
<text x="86" y="626" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#f2f6ff" >IBM hardware only carried the probes (ibm_marrakesh, one run): narrowing got 1.7 to 3.4 times random&#x27;s finds per billed second.</text>
<circle cx="72" cy="647" r="4" fill="#b48aff"/>
<text x="86" y="651" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#f2f6ff" >P18, replaying recorded Gen3 missions: 12 of 12 mechanisms against 11 for Gen3&#x27;s current rule; the win rests on one.</text>
<circle cx="72" cy="672" r="4" fill="#f2f6ff"/>
<text x="86" y="676" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#f2f6ff" >Gen2 work: scripted targets, no real target, nothing replayed or trained into Model 1.</text>
