<svg xmlns="http://www.w3.org/2000/svg" width="960" height="748" viewBox="0 0 960 748" role="img" aria-labelledby="title description">
<title id="title">Search order: organise search by mechanism, not by position</title><desc id="description">Search order: organise by mechanism, not by position (P1 to P18, November 9 to 17, 2026). Lesson: Organise search by mechanism (the kind of attack), not by where a candidate sits in a list. Panel 1, recorded Gen3 outcomes, not blind: 125 checks over 17 anonymised mechanisms; the mechanism alone predicts 111 of 125; M01 0 hits of 45; M02 8 hits of 20; M03 17 hits of 18; M04 3 hits of 13; M05 5 hits of 5; M06 1 hits of 5; M07 to M17 12 hits of 19. Panel 2, scripted test targets, development round: targets reached, every technique once, then focus 200 of 200; no sweep 142 of 200; narrowing by position, 1 level 124 of 200; narrowing by position, 2 levels 111 of 200; narrowing by position, 3 levels 107 of 200. On 200 fresh targets the scan reached 200 of 200 against 136 with no sweep, with 5.4 times the hits. Panel 3, scripted: mechanisms found per target by share of turns spent exploring, 100 percent exploring 0.566; 90 percent exploring 0.646; 75 percent exploring 0.622; 50 percent exploring 0.583; 25 percent exploring 0.501; 10 percent exploring 0.435; 0 percent exploring 0.371; best at 90 percent, and it held when the share of working variants changed. One IBM hardware run on ibm_marrakesh, where the hardware only carried the probes: narrowing found 1.7 and 3.4 times as many good candidates per billed second as random order, 27.0 billed seconds. A replay of recorded Gen3 missions (P18) then favoured the rule: 12 of 12 mechanisms against 11 for Gen3&#x27;s current next-test rule on the one counted mission; the win rests on one mechanism. Scripted test targets except P7 (one IBM hardware run) and the reads and replay of recorded Gen3 outcomes. No real target was contacted. No quantum advantage. Nothing here is a Model 1 result.</desc>
