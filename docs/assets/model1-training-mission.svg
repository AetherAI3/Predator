<text x="542" y="304" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#f2f6ff" >1,995 of 1,995 proposals valid, 0 refused: the model</text>
<text x="542" y="318" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#f2f6ff" >drives every stage.</text>
