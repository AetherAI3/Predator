<svg xmlns="http://www.w3.org/2000/svg" width="960" height="604" viewBox="0 0 960 604" role="img" aria-labelledby="title description">
<title id="title">Model-1 lane run R1: one 9B model drives a 400-pin mission end to end</title><desc id="description">Lane run R1, November 12, 2026, measured on fixtures with no quantum-computer time. A 9-billion-parameter model with an adapter trained on 804 teacher rows drove one whole 400-pin synthetic mission: 400 proposals at each of C1, C2 and C3, a selection step solved exactly on CPU that let 265 pins go on and parked 135, then 265 proposals at each of Q1, Q2 and Q3; 1995 of 1995 proposals valid, none refused. Findings found of 178: Oracle, no selection (ceiling) 178 with 0 false alarms; Oracle with selection 176 with 0 false alarms; Trained 9B model with selection 172 with 3 false alarms; Scripted rule with selection (floor) 156 with 0 false alarms. Preregistered verdict BEATS THE RULE. Caveats on the figure: a fixture shortcut picks the true sink in all 54 two-sink functions, the final decision is mostly a read-back of verifier evidence, and the model had no part in selection. Cost about 8.67 dollars of a 15 dollar line on CPU. No quantum advantage is claimed.</desc>
